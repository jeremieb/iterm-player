[package]
name = "iterm-player"
version = "0.2.7"
edition = "2024"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[dependencies]
crossterm = "0.29"
gstreamer = "0.25"
gstreamer-app = "0.25"
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
rustfft = "6.4"
serde_json = "1.0"
souvlaki = "0.8"
cocoa = "0.26"
objc = "0.2"
